<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>

body{
margin:0;
background:#0d0d0d;
font-family:sans-serif;
color:white;
}

.navbar{
position:sticky;
top:0;
z-index:999;
background:#0d0d0d;
padding:12px;
}

.title{
font-size:22px;
font-weight:bold;
color:#7f5af0;
}

.search{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:20px;
background:#1a1a1a;
color:white;
box-sizing:border-box;
outline:none;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card,
.ad-card{
background:#111;
border-radius:15px;
overflow:hidden;
position:relative;
cursor:pointer;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
display:block;
}

.card-title{
position:absolute;
left:0;
right:0;
bottom:0;
padding:10px;
font-size:13px;
background:linear-gradient(transparent,black);
}

.badge{
position:absolute;
top:10px;
left:10px;
background:#7f5af0;
padding:4px 8px;
font-size:11px;
border-radius:20px;
}

.ad-card{
height:220px;
}

#loading{
text-align:center;
padding:20px;
font-size:14px;
color:#999;
}

</style>
</head>

<body>

<div class="navbar">

<div class="title">
Asupanmu
</div>

<input
type="text"
id="search"
class="search"
placeholder="Search video..."
>

</div>


<div id="videos" class="container"></div>

<div id="loading">
Loading...
</div>



<script>

const API="/api/videos";

let page=1;

let loading=false;

let hasMore=true;

let videosGlobal=[];

const loadedIds=new Set();



// =====================
// POPUNDER
// =====================

function triggerPopunder(){

if(
!localStorage.getItem(
"popShown"
)
){

localStorage.setItem(
"popShown",
"true"
);

window.open(
"https://www.profitablecpmratenetwork.com/s6szeryj1j?key=67a910e3b4387aa420b25f4a4bfa41b1",
"_blank"
);

}

}



// =====================
// LOAD VIDEOS
// =====================

async function loadVideos(){

if(
loading||
!hasMore
) return;

loading=true;

try{

const res=
await fetch(
`${API}?page=${page}`
);

const data=
await res.json();

const videos=
data.videos||[];


// jika data habis
if(videos.length===0){

hasMore=false;

document.getElementById(
"loading"
).innerText=
"Semua video selesai";

return;

}



// =====================
// HAPUS DUPLIKAT
// =====================

const uniqueVideos=
videos.filter(v=>{

const id=
v.id||
v.link;

if(
loadedIds.has(id)
){

return false;

}

loadedIds.add(id);

return true;

});



videosGlobal.push(
...uniqueVideos
);


render(uniqueVideos);

page++;

}catch(err){

console.log(err);

document.getElementById(
"loading"
).innerText=
"Gagal load data";

}

loading=false;

}



// =====================
// NATIVE ADS
// =====================

function createNativeAd(){

const ad=
document.createElement(
"div"
);

ad.className=
"ad-card";


const script=
document.createElement(
"script"
);

script.async=true;

script.src=
"https://pl29343712.profitablecpmratenetwork.com/d6c7cfa2fbe3ee841c92a4f50371bf35/invoke.js";


const container=
document.createElement(
"div"
);

container.id=
"container-d6c7cfa2fbe3ee841c92a4f50371bf35";


ad.appendChild(script);

ad.appendChild(container);

return ad;

}



// =====================
// RENDER VIDEO
// =====================

function render(videos){

const container=
document.getElementById(
"videos"
);


videos.forEach((v,i)=>{


// native ads tiap 6 video
if(
(videosGlobal.length+i)%6===0
){

container.appendChild(
createNativeAd()
);

}


const el=
document.createElement(
"div"
);

el.className=
"card";


el.innerHTML=`

<div class="badge">

${v.source||"VIDEO"}

</div>

<img
src="${v.thumbnail}"
loading="lazy"
>

<div class="card-title">

${v.title}

</div>

`;



// =====================
// KLIK KE HALAMAN ASLI
// =====================

el.onclick=()=>{

triggerPopunder();

if(v.link){

window.location.href=
v.link;

}

};


container.appendChild(
el
);

});

}



// =====================
// INFINITE SCROLL
// =====================

window.addEventListener(
"scroll",
()=>{

if(

window.innerHeight+
window.scrollY>=
document.body.offsetHeight-500

){

loadVideos();

}

}
);



// =====================
// SEARCH
// =====================

document
.getElementById(
"search"
)
.addEventListener(
"input",
e=>{

const q=
e.target.value.toLowerCase();

const container=
document.getElementById(
"videos"
);

container.innerHTML="";


const filtered=
videosGlobal.filter(v=>

(v.title||"")
.toLowerCase()
.includes(q)

);


render(filtered);

}
);



// =====================
// INIT
// =====================

loadVideos();

</script>



<!-- SOCIAL BAR -->

<script src="https://pl29343713.profitablecpmratenetwork.com/9a/69/24/9a6924d62fcb5f212667f72bfbb2378f.js"></script>


</body>
</html>
